name: Tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test model selection and backend verification
        run: python -m unittest discover -s tests -v
      - name: Test setup verification in Windows PowerShell
        shell: powershell
        run: .\tests\test_setup.ps1
